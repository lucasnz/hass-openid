<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in error</title>
    <link rel="stylesheet" href="/openid/style.css" />
  </head>
  <body data-alert-type="$alert_type" data-alert-message="$alert_message">
    <div class="page-card">
      <h1>$alert_type</h1>
      <p class="message">$alert_message</p>
      <p><a class="inline-link" href="$redirect_url">Start a new sign-in</a></p>
    </div>
    <script src="/openid/error.js"></script>
  </body>
</html>
