<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continue sign in</title>
    <link rel="stylesheet" href="/openid/style.css" />
  </head>
  <body data-authorize-url="$authorize_url" data-transaction-id="$transaction_id">
    <div class="page-card">
      <h1>Continue sign in</h1>
      <p class="message">Open the sign-in page in your browser, then return here.</p>
      <p><a id="openid-authorize-link" class="inline-link" href="$authorize_url" target="_blank" rel="noopener noreferrer">Open sign-in page</a></p>
      <div class="warning">Keep this page open while signing in so Home Assistant can complete authentication.</div>
    </div>
    <script src="/openid/android-waiting.js"></script>
  </body>
</html>
